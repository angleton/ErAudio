<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErAudio Web Player (with Pitchfork Plugin UI)</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <div class="winamp-container">
    
    <!-- MAIN PLAYER WINDOW -->
    <div class="winamp-window main-window">
      <!-- Title Bar -->
      <div class="title-bar">
        <button class="title-bar-text title-bar-login tooltip-target" id="youtube-login" type="button" data-tooltip="Sign in to YouTube" aria-label="Sign in to YouTube">YOUTUBE LOGIN</button>
        <div class="title-bar-controls">
          <button class="win-btn minimize tooltip-target" type="button" data-action="minimize" data-tooltip="Minimize main player" aria-label="Minimize main player">_</button>
          <button class="win-btn close tooltip-target" type="button" data-action="close" data-tooltip="Close main player" aria-label="Close main player">X</button>
        </div>
      </div>

      <!-- Main Display Screen (Green/Yellow LCD) -->
      <div class="display-panel">
        <div class="display-left">
          <div class="timer-display">
            <span class="digit-minus"></span>
            <span class="digits" id="time-display">00:00</span>
          </div>
        </div>
        <div class="display-right">
          <div class="marquee-container">
            <div class="marquee-text" id="track-title">1. Retro YouTube Player - ErAudio Classic Theme</div>
          </div>
        </div>
      </div>

      <!-- Position / Track Scrubber -->
      <div class="scrubber-panel">
        <label class="sr-only" for="scrubber">Track position</label>
        <input type="range" class="winamp-slider scrubber" id="scrubber" data-control="scrubber" min="0" max="100" value="0">
      </div>

      <!-- Control Panel -->
      <div class="control-panel">
        <!-- Transport Buttons -->
        <div class="transport-buttons">
          <button class="transport-btn prev tooltip-target" type="button" data-action="previous" data-tooltip="Previous track" aria-label="Previous track">⏮</button>
          <button class="transport-btn play tooltip-target" type="button" data-action="play" data-tooltip="Play" aria-label="Play">▶</button>
          <button class="transport-btn pause tooltip-target" type="button" data-action="pause" data-tooltip="Pause" aria-label="Pause">⏸</button>
          <button class="transport-btn stop tooltip-target" type="button" data-action="stop" data-tooltip="Stop" aria-label="Stop">⏹</button>
          <button class="transport-btn next tooltip-target" type="button" data-action="next" data-tooltip="Next track" aria-label="Next track">⏭</button>
          <button class="transport-btn eject tooltip-target" type="button" data-action="open" data-tooltip="Open a YouTube URL or video ID" aria-label="Open a YouTube URL or video ID">⏏</button>
        </div>

        <!-- Volume Slider -->
        <div class="sliders-group">
          <div class="slider-row">
            <label for="volume">VOL</label>
            <input type="range" class="winamp-slider volume" id="volume" data-control="volume" min="0" max="100" value="80">
          </div>
        </div>

        <!-- Toggle Buttons (PL, Pitchfork) -->
        <div class="toggle-buttons">
          <button class="toggle-btn tooltip-target" id="btn-pl" type="button" data-action="toggle-playlist" data-tooltip="Toggle playlist" aria-pressed="false">PL</button>
          <button class="toggle-btn tooltip-target" id="btn-pf" type="button" data-action="toggle-pitchfork" data-tooltip="Toggle Pitchfork controls" aria-pressed="false">PITCH</button>
        </div>
      </div>
    </div>

    <!-- PITCHFORK PLUGIN WINDOW -->
    <div class="winamp-window pitchfork-window" id="pitchfork-window" hidden>
      <div class="title-bar">
        <div class="title-bar-text">PITCHFORK - SPEED CONTROL</div>
      </div>

      <div class="plugin-body">
        <div class="plugin-header">
          <span class="plugin-status-led active"></span>
          <span class="plugin-title">HIGH-GRANULARITY SPEED CONTROL</span>
          <button class="plugin-reset-btn tooltip-target" id="btn-reset-all" type="button" data-action="reset" data-tooltip="Reset speed">RESET ALL</button>
        </div>

        <div class="plugin-sliders-grid">
          <!-- SPEED CONTROL -->
          <div class="plugin-control-card">
            <div class="card-header">
              <span class="card-label">PLAYBACK SPEED</span>
              <span class="card-value" id="val-speed">1.000x</span>
            </div>
            <div class="slider-wrapper">
              <label class="sr-only" for="speed-slider">Playback speed</label>
              <input type="range" class="winamp-slider speed-slider" id="speed-slider" data-control="speed" min="0.0625" max="4.00" step="0.0025" value="1.00">
            </div>
            <div class="preset-pills">
              <button class="preset-pill" type="button" data-speed="0.7">0.7x</button>
              <button class="preset-pill" type="button" data-speed="0.8">0.8x</button>
              <button class="preset-pill" type="button" data-speed="0.9">0.9x</button>
              <button class="preset-pill active" type="button" data-speed="1.0">1.0x</button>
              <button class="preset-pill" type="button" data-speed="1.1">1.1x</button>
              <button class="preset-pill" type="button" data-speed="1.2">1.2x</button>
              <button class="preset-pill" type="button" data-speed="1.3">1.3x</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- PLAYLIST WINDOW -->
    <div class="winamp-window playlist-window" id="playlist-window" hidden>
      <div class="title-bar">
        <div class="title-bar-text">ErAudio PLAYLIST</div>
      </div>

      <div class="playlist-body">
        <div class="playlist-source" id="playlist-source-row" hidden>
          <label for="favorites-select">FAVORITES</label>
          <select id="favorites-select" aria-label="Select Favorites list"></select>
        </div>
        <!-- Playlist Tracks List -->
        <div class="playlist-list" id="playlist-list" aria-label="Favorite videos"></div>
      </div>

      <div class="playlist-footer">
        <button class="pl-btn" type="button" data-action="add-url">+ ADD URL</button>
        <button class="pl-btn" type="button" data-action="remove-track">- REMOVE</button>
        <button class="pl-btn" type="button" data-action="select-all">SEL ALL</button>
        <div class="pl-info" id="playlist-info">FAVORITES</div>
      </div>
    </div>

  </div>
  <dialog class="open-dialog" id="open-dialog" aria-labelledby="open-dialog-title">
    <form class="open-dialog-form" id="open-form" novalidate>
      <div class="title-bar">
        <h2 class="title-bar-text" id="open-dialog-title">OPEN YOUTUBE VIDEO</h2>
        <button class="win-btn" type="button" data-action="close-open-dialog" aria-label="Close dialog">X</button>
      </div>
      <div class="open-dialog-body">
        <label for="youtube-input">VIDEO URL OR ID</label>
        <input id="youtube-input" name="youtubeInput" type="text" autocomplete="url" spellcheck="false" placeholder="Paste a YouTube link or video ID" aria-describedby="youtube-input-error" autofocus>
        <p class="open-dialog-error" id="youtube-input-error" role="alert" aria-live="polite"></p>
      </div>
      <div class="open-dialog-actions">
        <button class="pl-btn" type="button" data-action="close-open-dialog">CANCEL</button>
        <button class="pl-btn open-submit" type="submit">OPEN</button>
      </div>
    </form>
  </dialog>
  <p class="event-status" id="event-status" role="status" aria-live="polite">Ready for input events.</p>
</body>
</html>
